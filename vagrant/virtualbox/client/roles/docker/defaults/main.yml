# Définiton des variables par défaut pour le rôle "common"
---
# Docker GPG keys and repositories
gpg_keys:
- key: https://download.docker.com/linux/ubuntu/gpg

# Docker
repositories:
- repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release | lower }} stable"
  state: present

binfmt_image: tonistiigi/binfmt:latest

#  Docker packages to install
docker_packages:
- name: docker-ce
- name: docker-ce-cli 
- name: containerd.io
- name: docker-buildx-plugin
- name: docker-compose-plugin