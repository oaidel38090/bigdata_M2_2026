include:
  - path: ./clickhouse/docker-compose.yml
  - path: ./hadoop/docker-compose.yml
  - path: ./jupyterlab/docker-compose.yml
  - path: ./mongo/docker-compose.yml
  - path: ./neo4j/docker-compose.yml
  - path: ./pgdw/docker-compose.yml
  - path: ./redis/docker-compose.yml
  - path: ./s3/docker-compose.yml
  - path: ./spark/docker-compose.yml
  
services:

  init-network:
    image: alpine:3.20
    platform: linux/amd64
    command: ["sh", "-c", "sleep infinity"]
    networks:
      - datalab

  qemu-binfmt:
    image: tonistiigi/binfmt
    privileged: true
    command: ["--install", "amd64"]
    profiles:
      - arm64

networks:
  datalab:
    name: datalab
    driver: bridge
