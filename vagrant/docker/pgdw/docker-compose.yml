services:
  pgdw:
    image: postgres:17
    profiles: [pgdw]
    container_name: pgdw
    hostname: pgdw
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=warehouse
    ports:
      - "5432:5432"
    volumes:
      - pgdw_data:/var/lib/postgresql/data
    networks:
      - datalab

volumes:
  pgdw_data:
