- name: Create spark directory
  file:
    path: "{{ spark_home }}"
    state: directory
    owner: vagrant
    group: vagrant


- name: Download Spark
  get_url:
    url: "{{ spark_url }}"
    dest: "{{ spark_src_dir }}/spark-{{ spark_version }}-bin-hadoop3.tgz"


- name: Extract Spark
  unarchive:
    src: "{{ spark_src_dir }}/spark-{{ spark_version }}-bin-hadoop3.tgz"
    dest: "{{ spark_home }}"
    remote_src: yes
    extra_opts: [--strip-components=1]


- name: Set Spark environment variables
  blockinfile:
    path: /home/vagrant/.bashrc
    block: |
      export SPARK_HOME={{ spark_home }}
      export PATH=$SPARK_HOME/bin:$SPARK_HOME/sbin:$PATH
      export PYSPARK_PYTHON=/usr/bin/python3
    marker: "# {mark} SPARK ENV"
  become_user: vagrant