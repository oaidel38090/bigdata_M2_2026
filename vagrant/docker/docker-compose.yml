include:
  - path: ./airflow/docker-compose.yml
  - path: ./dbt/docker-compose.yml
  - path: ./hadoop/docker-compose.yml
  - path: ./spark/docker-compose.yml
  - path: ./pgdw/docker-compose.yml
  - path: ./s3/docker-compose.yml
  - path: ./trino/docker-compose.yml

services:

  init-network:
    image: alpine:3.20
    platform: linux/amd64
    command: ["sh", "-c", "sleep infinity"]
    networks:
      - datalab

  qemu-binfmt:
    image: tonistiigi/binfmt
    privileged: true
    command: ["--install", "amd64"]
    profiles:
      - arm64

networks:
  datalab:
    external: true
    name: datalab
